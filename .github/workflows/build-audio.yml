name: Build audio decoders
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Build four audio decoder architectures
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: bash scripts/build-audio-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audio-native-libs
          path: android/decoder-ffmpeg/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 30
