apply plugin: 'com.android.application'

android {
    namespace = "com.xibao.iptv"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.xibao.iptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 200
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def releaseStore = System.getenv('XIBAO_KEYSTORE')
    def releaseStorePassword = System.getenv('XIBAO_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('XIBAO_KEY_ALIAS') ?: 'xibao-tv'
    def releaseKeyPassword = System.getenv('XIBAO_KEY_PASSWORD') ?: releaseStorePassword

    signingConfigs {
        if (releaseStore && releaseStorePassword) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.findByName('release')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
