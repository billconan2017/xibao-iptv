apply plugin: 'com.android.application'

android {
    namespace = "com.xibao.iptv"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.xibao.iptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 243
        versionName "2.4.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }

    // Keep the universal APK practical to download with two native engines.
    // Libraries are extracted by Android; each 64-bit ELF remains 16 KB aligned.
    packaging { jniLibs { useLegacyPackaging = true } }

    def releaseStore = System.getenv('XIBAO_KEYSTORE')
    def releaseStorePassword = System.getenv('XIBAO_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('XIBAO_KEY_ALIAS') ?: 'xibao-tv'
    def releaseKeyPassword = System.getenv('XIBAO_KEY_PASSWORD') ?: releaseStorePassword

    signingConfigs {
        if (releaseStore && releaseStorePassword) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.findByName('release')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.7.6'
    implementation project(':decoder-ffmpeg')
    testImplementation 'org.robolectric:robolectric:4.16'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Release builds must not silently fall back to a decoder-less APK.
tasks.register('verifyAudioNativeLibraries') {
    doLast {
        ['armeabi-v7a','arm64-v8a','x86','x86_64'].each { abi ->
            def nativeLib = project(':decoder-ffmpeg').file("src/main/jniLibs/${abi}/libffmpegJNI.so")
            if (!nativeLib.exists() || nativeLib.length() < 10000) {
                throw new GradleException("Missing FFmpeg audio library for ${abi}. Run scripts/build-audio-native.sh or download the CI artifact; see decoder-ffmpeg/README.md.")
            }
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyAudioNativeLibraries' }
